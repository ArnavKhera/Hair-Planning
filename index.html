<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hair Washing Scheduler</title>
    <style>
        :root {
            --primary: #6b4c9a;
            --secondary: #9b72cf;
            --bg: #fdfbf7;
            --text: #333;
            --good-hair: #d4edda;
            --good-hair-text: #155724;
            --bad-hair: #f8d7da;
            --bad-hair-text: #721c24;
            --wash-day: #cce5ff;
            --wash-day-text: #004085;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            line-height: 1.6;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        h1 { color: var(--primary); }

        /* Controls Section */
        .controls {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
        }

        label {
            font-weight: bold;
            margin-bottom: 5px;
            font-size: 0.9em;
            color: #555;
        }

        input, select, button {
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 1rem;
        }

        button {
            cursor: pointer;
            background-color: var(--primary);
            color: white;
            border: none;
            transition: background 0.2s;
        }

        button:hover { background-color: var(--secondary); }
        
        button.wash-btn {
            background-color: #007bff;
            font-weight: bold;
            margin-top: 10px;
        }

        /* Weather Section */
        .weather-banner {
            background: linear-gradient(135deg, #a18cd1 0%, #fbc2eb 100%);
            color: white;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .weather-info h3 { margin: 0 0 5px 0; }
        .weather-details { font-size: 0.9rem; opacity: 0.9; }

        /* Calendar */
        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 10px;
        }

        .day-name {
            text-align: center;
            font-weight: bold;
            color: #777;
            padding-bottom: 10px;
        }

        .calendar-day {
            background: white;
            border-radius: 8px;
            min-height: 100px;
            padding: 10px;
            position: relative;
            border: 1px solid #eee;
            transition: transform 0.2s;
        }

        .calendar-day:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        .date-num {
            font-weight: bold;
            margin-bottom: 5px;
            display: block;
        }

        /* Status Indicators */
        .status-badge {
            display: inline-block;
            font-size: 0.75rem;
            padding: 2px 6px;
            border-radius: 4px;
            margin-bottom: 4px;
            font-weight: 600;
        }

        .status-wash { background: var(--wash-day); color: var(--wash-day-text); }
        .status-ideal { background: var(--good-hair); color: var(--good-hair-text); }
        .status-wash-again { background: var(--bad-hair); color: var(--bad-hair-text); }

        /* Events */
        .event-marker {
            font-size: 0.8rem;
            background: #eee;
            padding: 3px 6px;
            border-radius: 4px;
            margin-top: 2px;
            border-left: 3px solid #ccc;
        }

        .event-good { border-left-color: #28a745; background: #e9f7ef; }
        .event-bad { border-left-color: #dc3545; background: #fce8e8; }

        /* Event Form */
        .add-event-box {
            background: white;
            padding: 20px;
            border-radius: 12px;
            margin-top: 30px;
            border-top: 4px solid var(--primary);
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>🚿 Hair Washing Scheduler</h1>
        <p>Plan your wash days around your life (and the weather).</p>
    </header>

    <div class="weather-banner" id="weatherDisplay">
        <div class="weather-info">
            <h3 id="weatherLocation">Loading Weather...</h3>
            <div class="weather-details" id="weatherDetails">Please enter a city below</div>
        </div>
        <div style="font-size: 2.5rem;" id="weatherIcon">🌥</div>
    </div>

    <div class="controls">
        <div class="control-group">
            <label>Current Location (City)</label>
            <div style="display: flex; gap: 5px;">
                <input type="text" id="cityInput" placeholder="e.g. Seattle" value="New York">
                <button onclick="fetchWeather()">Set</button>
            </div>
        </div>

        <div class="control-group">
            <label>Ideal Curls Appear (Days after wash)</label>
            <input type="number" id="curlDelay" value="1" min="0">
        </div>

        <div class="control-group">
            <label>Style Lasts For (Days)</label>
            <input type="number" id="styleDuration" value="3" min="1">
        </div>

        <div class="control-group">
            <label>Log Action</label>
            <button class="wash-btn" onclick="logWashToday()">I Washed My Hair Today</button>
        </div>
    </div>

    <div class="calendar-header">
        <button onclick="changeMonth(-1)">&#8592; Prev</button>
        <h2 id="currentMonthYear">Month Year</h2>
        <button onclick="changeMonth(1)">Next &#8594;</button>
    </div>

    <div class="calendar-grid" id="calendarGrid">
        </div>

    <div class="add-event-box">
        <h3>📅 Add Event</h3>
        <div style="display: flex; gap: 10px; flex-wrap: wrap;">
            <input type="text" id="eventTitle" placeholder="Event Name (e.g. Date Night)" style="flex: 2;">
            <input type="date" id="eventDate" style="flex: 1;">
            <button onclick="addEvent()">Add to Calendar</button>
        </div>
        <p style="font-size: 0.8rem; color: #666; margin-top: 10px;">
            *Events will be color-coded green if they fall in your ideal hair window!
        </p>
    </div>
</div>

<script>
    // --- STATE MANAGEMENT ---
    let currentDate = new Date();
    let settings = {
        lastWashDate: null,
        curlDelay: 1,
        styleDuration: 3,
        location: "New York",
        events: [] // Array of {title, date}
    };

    // Load from LocalStorage
    function loadSettings() {
        const saved = localStorage.getItem('hairSchedulerSettings');
        if (saved) {
            settings = JSON.parse(saved);
            document.getElementById('cityInput').value = settings.location;
            document.getElementById('curlDelay').value = settings.curlDelay;
            document.getElementById('styleDuration').value = settings.styleDuration;
        }
        fetchWeather(); // Get weather on load
        renderCalendar();
    }

    function saveSettings() {
        settings.location = document.getElementById('cityInput').value;
        settings.curlDelay = parseInt(document.getElementById('curlDelay').value);
        settings.styleDuration = parseInt(document.getElementById('styleDuration').value);
        localStorage.setItem('hairSchedulerSettings', JSON.stringify(settings));
        renderCalendar();
    }

    // --- WEATHER LOGIC (Open-Meteo API) ---
    async function fetchWeather() {
        const city = document.getElementById('cityInput').value;
        saveSettings(); // Save the new city

        try {
            // 1. Geocoding: Get Lat/Lon for City
            const geoRes = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${city}&count=1&language=en&format=json`);
            const geoData = await geoRes.json();

            if (!geoData.results) {
                document.getElementById('weatherLocation').innerText = "City not found";
                return;
            }

            const { latitude, longitude, name } = geoData.results[0];

            // 2. Get Weather
            const weatherRes = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&daily=temperature_2m_max,precipitation_probability_max,relative_humidity_2m_max&timezone=auto`);
            const weatherData = await weatherRes.json();

            // Display Today's Forecast
            const todayMax = weatherData.daily.temperature_2m_max[0];
            const rainProb = weatherData.daily.precipitation_probability_max[0];
            const humidity = weatherData.daily.relative_humidity_2m_max[0];

            document.getElementById('weatherLocation').innerText = `Forecast for ${name}`;
            document.getElementById('weatherDetails').innerText = 
                `Temp: ${todayMax}°C | Humidity: ${humidity}% | Rain Chance: ${rainProb}%`;

            if(rainProb > 50) document.getElementById('weatherIcon').innerText = "🌧";
            else if (humidity > 70) document.getElementById('weatherIcon').innerText = "🌫"; // Frizz warning
            else document.getElementById('weatherIcon').innerText = "🌤";

        } catch (e) {
            console.error(e);
            document.getElementById('weatherDetails').innerText = "Could not load weather.";
        }
    }

    // --- WASH LOGIC ---
    function logWashToday() {
        const today = new Date();
        // Store as YYYY-MM-DD string to avoid timezone issues
        settings.lastWashDate = today.toISOString().split('T')[0];
        saveSettings();
        alert("Wash logged! Calendar updated.");
    }

    // --- CALENDAR LOGIC ---
    function changeMonth(step) {
        currentDate.setMonth(currentDate.getMonth() + step);
        renderCalendar();
    }

    function getHairStatus(dateStr) {
        if (!settings.lastWashDate) return null;

        const washDate = new Date(settings.lastWashDate);
        const checkDate = new Date(dateStr);
        
        // Calculate difference in days
        const diffTime = checkDate - washDate;
        const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24)); 

        if (diffDays === 0) return { type: 'wash', label: 'Wash Day' };
        
        const idealStart = settings.curlDelay;
        const idealEnd = settings.curlDelay + settings.styleDuration;

        if (diffDays >= idealStart && diffDays < idealEnd) {
            return { type: 'ideal', label: 'Ideal Curls' };
        }
        
        if (diffDays >= idealEnd) {
            return { type: 'wash-again', label: 'Needs Wash' };
        }

        return null; // In between (drying/settling)
    }

    function renderCalendar() {
        const grid = document.getElementById('calendarGrid');
        grid.innerHTML = ''; // Clear previous

        const year = currentDate.getFullYear();
        const month = currentDate.getMonth();

        // Update Header
        const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
        document.getElementById('currentMonthYear').innerText = `${monthNames[month]} ${year}`;

        // Days of Week Headers
        ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'].forEach(day => {
            const el = document.createElement('div');
            el.className = 'day-name';
            el.innerText = day;
            grid.appendChild(el);
        });

        // Get first day of month and total days
        const firstDay = new Date(year, month, 1).getDay();
        const daysInMonth = new Date(year, month + 1, 0).getDate();

        // Empty slots for previous month
        for (let i = 0; i < firstDay; i++) {
            const el = document.createElement('div');
            grid.appendChild(el);
        }

        // Draw Days
        for (let d = 1; d <= daysInMonth; d++) {
            const cell = document.createElement('div');
            cell.className = 'calendar-day';
            
            // Format date string YYYY-MM-DD (local time safety)
            const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
            
            // Date Number
            cell.innerHTML = `<span class="date-num">${d}</span>`;

            // 1. Check Hair Status
            const status = getHairStatus(dateStr);
            if (status) {
                const badge = document.createElement('div');
                badge.className = `status-badge status-${status.type}`;
                badge.innerText = status.label;
                cell.appendChild(badge);
            }

            // 2. Check Events
            const dayEvents = settings.events.filter(e => e.date === dateStr);
            dayEvents.forEach(ev => {
                const marker = document.createElement('div');
                marker.className = 'event-marker';
                
                // Color logic for events
                if (status && status.type === 'ideal') {
                    marker.classList.add('event-good');
                    marker.innerText = `✨ ${ev.title}`;
                } else if (status && (status.type === 'wash-again' || status.type === 'wash')) {
                    marker.classList.add('event-bad');
                    marker.innerText = `⚠️ ${ev.title}`;
                } else {
                    marker.innerText = ev.title;
                }
                
                cell.appendChild(marker);
            });

            grid.appendChild(cell);
        }
    }

    // --- EVENT LOGIC ---
    function addEvent() {
        const title = document.getElementById('eventTitle').value;
        const date = document.getElementById('eventDate').value;

        if (!title || !date) {
            alert("Please enter both a name and a date.");
            return;
        }

        settings.events.push({ title, date });
        saveSettings();
        
        // Clear inputs
        document.getElementById('eventTitle').value = '';
        renderCalendar();
    }

    // Event Listeners for settings changes
    document.getElementById('curlDelay').addEventListener('change', saveSettings);
    document.getElementById('styleDuration').addEventListener('change', saveSettings);

    // Initial Load
    loadSettings();

</script>

</body>
</html>
